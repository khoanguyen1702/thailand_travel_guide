<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Trip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Language Toggle -->
    <div class="language-toggle">
        <button class="lang-btn active" data-lang="en" title="English">🇺🇸</button>
        <button class="lang-btn" data-lang="vi" title="Tiếng Việt">🇻🇳</button>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 data-en="Thailand Trip" data-vi="Chuyến Du Lịch Thái Lan">Thailand Trip</h1>
            <p class="subtitle" data-en="April 24 - 29, 2026" data-vi="24 - 29 Tháng Tư, 2026">April 24 - 29, 2026</p>
        </header>

        <!-- Day Navigation -->
        <section class="day-nav-section">
            <div class="day-nav">
                <div class="day-nav-item active" data-day="1" onclick="selectDay(1)">
                    <button class="day-nav-btn day-1">
                        <span class="day-num">1</span>
                        <span class="day-label">DAY</span>
                    </button>
                    <span class="day-date">Apr 24</span>
                </div>
                <div class="day-nav-item" data-day="2" onclick="selectDay(2)">
                    <button class="day-nav-btn day-2">
                        <span class="day-num">2</span>
                        <span class="day-label">DAY</span>
                    </button>
                    <span class="day-date">Apr 25</span>
                </div>
                <div class="day-nav-item" data-day="3" onclick="selectDay(3)">
                    <button class="day-nav-btn day-3">
                        <span class="day-num">3</span>
                        <span class="day-label">DAY</span>
                    </button>
                    <span class="day-date">Apr 26</span>
                </div>
                <div class="day-nav-item" data-day="4" onclick="selectDay(4)">
                    <button class="day-nav-btn day-4">
                        <span class="day-num">4</span>
                        <span class="day-label">DAY</span>
                    </button>
                    <span class="day-date">Apr 27</span>
                </div>
                <div class="day-nav-item" data-day="5" onclick="selectDay(5)">
                    <button class="day-nav-btn day-5">
                        <span class="day-num">5</span>
                        <span class="day-label">DAY</span>
                    </button>
                    <span class="day-date">Apr 28</span>
                </div>
                <div class="day-nav-item" data-day="6" onclick="selectDay(6)">
                    <button class="day-nav-btn day-6">
                        <span class="day-num">6</span>
                        <span class="day-label">DAY</span>
                    </button>
                    <span class="day-date">Apr 29</span>
                </div>
            </div>
        </section>
        <!-- Day Content -->
        <section class="day-content">
            <div class="day-header">
                <h2 id="current-day-title" data-en="Day 1 - April 24" data-vi="Ngày 1 - 24 Tháng Tư">Day 1 - April 24</h2>
                <button class="btn-payment" onclick="openPaymentCalculator()" data-en="💰 Payment Calculator" data-vi="💰 Tính Toán Chi Phí">💰 Payment Calculator</button>
            </div>

            <!-- Payment Calculator Modal -->
            <div id="payment-modal" class="modal" style="display: none;">
                <div class="modal-content payment-modal-custom">
                    <span class="close" onclick="closePaymentCalculator()">&times;</span>
                    <h2 data-en="Payment Calculator" data-vi="Tính Toán Chi Phí">Payment Calculator</h2>
                    
                    <div class="payment-inputs-new">
                        <div class="input-group">
                            <label data-en="Payer:" data-vi="Người Chi Tiền:">Payer:</label>
                            <select id="payer-select" class="payer-dropdown">
                                <option value="">-- Select --</option>
                                <option value="Ben">Ben</option>
                                <option value="Sang">Sang</option>
                                <option value="Pha">Pha</option>
                                <option value="Harry">Harry</option>
                                <option value="Phong">Phong</option>
                                <option value="Vien">Vien</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label data-en="Amount Paid:" data-vi="Số Tiền Đã Chi:">Amount Paid:</label>
                            <input type="number" id="amount-paid-new" placeholder="0" min="0">
                        </div>

                        <div class="input-group">
                            <label data-en="Split with:" data-vi="Chia với:">Split with:</label>
                            <div class="split-checkboxes">
                                <div class="checkbox-item"><input type="checkbox" id="split-Ben" value="Ben"> <label for="split-Ben">Ben</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="split-Sang" value="Sang"> <label for="split-Sang">Sang</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="split-Pha" value="Pha"> <label for="split-Pha">Pha</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="split-Harry" value="Harry"> <label for="split-Harry">Harry</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="split-Phong" value="Phong"> <label for="split-Phong">Phong</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="split-Vien" value="Vien"> <label for="split-Vien">Vien</label></div>
                            </div>
                        </div>
                    </div>

                    <button onclick="addPaymentTransaction()" style="width: 100%; background: var(--sage-green); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; margin: 15px 0;">➕ Add</button>

                    <!-- Settlement Table -->
                    <div id="settlement-table" style="margin-top: 20px;">
                        <!-- Will be populated by JS -->
                    </div>

                    <!-- Transaction History -->
                    <div id="transaction-history" style="margin-top: 20px; border-top: 2px solid var(--sage-green); padding-top: 15px;">
                        <!-- Will be populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Activities Content -->
            <div class="activities-content" id="activities-content">
                <!-- Will be populated by JavaScript -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
